.burst{position:absolute;inset:0;pointer-events:none;z-index:5}.afterimage{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;z-index:2;opacity:.42;filter:saturate(1.55) brightness(1.35) drop-shadow(0 0 24px #baff73);animation:afterimage .48s ease-out forwards}.growthWord{position:absolute;left:50%;top:8%;transform:translateX(-50%);font-size:24px;font-weight:1000;color:#fff7a8;text-shadow:0 0 15px #84ff86,0 4px 0 #245036;opacity:0;z-index:9;pointer-events:none;white-space:nowrap}.growthWord.show{animation:growthWord .55s cubic-bezier(.12,.88,.18,1)}.spark{position:absolute;left:50%;top:50%;width:8px;height:8px;border-radius:50%;background:#fff6a2;box-shadow:0 0 14px #fff06a;transform:translate(-50%,-50%);animation:spark .48s ease-out forwards}.leaf{position:absolute;left:50%;top:52%;width:13px;height:8px;border-radius:100% 0 100% 0;background:linear-gradient(135deg,#dfff73,#3be58f);box-shadow:0 0 10px #7cff9a;transform:translate(-50%,-50%) rotate(var(--r));animation:leafFly .62s ease-out forwards}.ring{position:absolute;left:50%;top:50%;width:42%;height:42%;border:5px solid #dfffa0;border-radius:50%;transform:translate(-50%,-50%) scale(.45);opacity:.9;animation:ring .46s ease-out forwards;z-index:2}.evoText{position:absolute;left:50%;top:12%;transform:translateX(-50%) scale(.7);font-size:30px;font-weight:1000;color:#fff3a6;text-shadow:0 0 18px #9dff79,0 4px 0 #264c2b;opacity:0;z-index:8;pointer-events:none}.evoText.show{animation:evoText .75s ease-out}.progressHint{position:absolute;bottom:1%;left:50%;transform:translateX(-50%);font-size:10px;font-weight:900;letter-spacing:.12em;color:#d9fff0;opacity:.7;z-index:6}
.bottom{z-index:3;display:grid;justify-items:stretch;gap:6px}.tap{width:100%;height:96px;border-radius:29px;border:0;background:linear-gradient(#ffd85a 0,#ffad2f 54%,#ff7f2a 100%);box-shadow:0 8px 0 #ae461d,0 14px 28px #0008,inset 0 3px #fff5;color:#fff;font-size:42px;font-weight:1000;letter-spacing:.08em;text-shadow:0 3px 0 #a94c15}.tap:active{transform:translateY(5px) scale(.995);box-shadow:0 3px 0 #ae461d,0 8px 18px #0008,inset 0 2px #fff5}.tap[disabled]{opacity:.48}.hint{font-size:10px;color:#9dd5e1;letter-spacing:.07em}
.overlay{position:absolute;inset:0;z-index:20;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 34%,#2a8f8a55 0,transparent 35%),linear-gradient(#062443f0,#031223f5);backdrop-filter:blur(5px)}.hidden{display:none!important}.card{width:100%;max-width:370px;text-align:center;border:1px solid #ffffff24;border-radius:28px;padding:24px 20px;background:linear-gradient(180deg,#0f416dcc,#082746e8);box-shadow:0 24px 60px #000a}.hero{font-size:48px;line-height:.88;font-weight:1000;letter-spacing:-.055em;text-shadow:0 4px 0 #0a3157}.hero .tapWord{color:#ffd743}.hero .evoWord{color:#61dfff}.heroChar{width:220px;height:220px;object-fit:contain;margin:4px auto -8px;display:block;filter:drop-shadow(0 13px 18px #0007)}.sub{font-size:15px;font-weight:900;margin:0 0 18px;color:#d7f8ff}.startBtn{width:100%;height:66px;border:0;border-radius:22px;background:linear-gradient(#7effa3,#46d37d);box-shadow:0 6px 0 #1e8650;color:#073b22;font-size:24px;font-weight:1000}.startBtn[disabled]{opacity:.5;filter:grayscale(.35);box-shadow:none}.result{font-size:32px;font-weight:1000}.stars{font-size:35px;color:#ffd64d;text-shadow:0 0 14px #ffd64d77}.newRecord{font-size:20px;color:#ff7660;font-weight:1000;min-height:24px}.big{font-size:56px;font-weight:1000;line-height:1}.resultChar{width:132px;height:132px;object-fit:contain;filter:drop-shadow(0 8px 12px #0008)}.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 16px}.meta div{border-radius:15px;background:#ffffff0c;padding:10px;color:#a9d7e8;font-size:10px}.meta b{display:block;color:#fff;font-size:18px;margin-top:3px}
@keyframes growthCrouch{0%{transform:translateY(var(--growthLift)) scale(var(--growthScale))}35%{transform:translateY(20px) scale(1.16,.72)}68%{transform:translateY(-13px) scale(.92,1.18)}100%{transform:translateY(var(--growthLift)) scale(var(--growthScale))}}@keyframes growthReachL{0%{transform:translateY(var(--growthLift)) scale(var(--growthScale))}38%{transform:translate(-28px,-8px) rotate(-15deg) scale(1.08,.91)}72%{transform:translate(9px,-18px) rotate(6deg) scale(.96,1.12)}100%{transform:translateY(var(--growthLift)) scale(var(--growthScale))}}@keyframes growthReachR{0%{transform:translateY(var(--growthLift)) scale(var(--growthScale))}38%{transform:translate(28px,-8px) rotate(15deg) scale(1.08,.91)}72%{transform:translate(-9px,-18px) rotate(-6deg) scale(.96,1.12)}100%{transform:translateY(var(--growthLift)) scale(var(--growthScale))}}@keyframes growthStretch{0%{transform:translateY(var(--growthLift)) scale(var(--growthScale))}32%{transform:translateY(18px) scale(1.18,.72)}68%{transform:translateY(-32px) scale(.82,1.30)}100%{transform:translateY(var(--growthLift)) scale(var(--growthScale))}}@keyframes growthTwist{0%{transform:translateY(var(--growthLift)) rotate(0) scale(var(--growthScale))}34%{transform:translate(-18px,-16px) rotate(-18deg) scale(.92,1.14)}68%{transform:translate(18px,-25px) rotate(18deg) scale(1.13,.88)}100%{transform:translateY(var(--growthLift)) rotate(0) scale(var(--growthScale))}}@keyframes growthLeap{0%{transform:translateY(var(--growthLift)) scale(var(--growthScale))}25%{transform:translateY(20px) scale(1.18,.68)}58%{transform:translateY(-48px) rotate(9deg) scale(.88,1.26)}78%{transform:translateY(-22px) rotate(-5deg) scale(1.12,.9)}100%{transform:translateY(var(--growthLift)) scale(var(--growthScale))}}@keyframes comboBurst{0%{transform:scale(1)}32%{transform:scale(1.19,.77) translateY(16px)}62%{transform:scale(.88,1.23) translateY(-25px)}82%{transform:scale(1.07) rotate(5deg)}100%{transform:scale(1) rotate(0)}}@keyframes evolve{0%{transform:scale(.48) rotate(-18deg);filter:brightness(2.9) drop-shadow(0 0 42px #eaff7d)}42%{transform:scale(1.30) rotate(12deg)}66%{transform:scale(.90) rotate(-6deg)}83%{transform:scale(1.08) rotate(3deg)}100%{transform:scale(1) rotate(0)}}@keyframes screenKick{0%{transform:translate(0,0)}30%{transform:translate(-3px,2px)}60%{transform:translate(3px,-2px)}100%{transform:translate(0,0)}}@keyframes spark{0%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(.18)}}@keyframes leafFly{0%{opacity:1;transform:translate(-50%,-50%) rotate(var(--r)) scale(.8)}100%{opacity:0;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) rotate(calc(var(--r) + 160deg)) scale(1.35)}}@keyframes ring{to{transform:translate(-50%,-50%) scale(1.7);opacity:0}}@keyframes afterimage{0%{opacity:.46;transform:translate(0,0) rotate(0) scale(.94)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(var(--ghostScale))}}@keyframes growthWord{0%{opacity:0;transform:translateX(-50%) translateY(18px) scale(.55)}28%{opacity:1;transform:translateX(-50%) translateY(-4px) scale(1.18)}100%{opacity:0;transform:translateX(-50%) translateY(-28px) scale(.88)}}@keyframes evoText{0%{opacity:0;transform:translateX(-50%) translateY(14px) scale(.62)}28%{opacity:1;transform:translateX(-50%) translateY(-3px) scale(1.13)}100%{opacity:0;transform:translateX(-50%) translateY(-22px) scale(1)}}
</style>

<body>
<main class="game" id="game"><header class="hud"><div class="logo">TAP TAP <span>EVO</span></div><div class="score">SCORE<b id="score">0</b></div></header><div class="time"><span>TIME</span><div class="track"><i class="bar" id="bar"></i></div><span id="sec">15</span></div><section class="stage"><div class="stageName" id="stageName" data-stage="1">STAGE 1<b>ねむねむ</b></div><div class="combo" id="combo"><strong>0</strong> combo</div><div class="earthWrap" id="earthWrap"><div class="glow"></div><div class="aura"></div><div class="platform"></div><canvas class="earthCanvas" id="earthCanvas" width="660" height="660" aria-label="動いて進化する地球ちゃん"></canvas><img class="earthLayer" id="earthCurrent" alt="地球ちゃん"><img class="earthLayer" id="earthNext" alt="" aria-hidden="true"><div class="burst" id="burst"></div><div class="evoText" id="evoText">EVOLVE!</div><div class="growthWord" id="growthWord"></div><div class="progressHint" id="progressHint">EVOLUTION 0%</div></div></section><footer class="bottom"><button class="tap" id="tap" disabled>TAP</button><div class="hint">タップするほど、少しずつ姿と動きが変わる。</div></footer><section class="overlay" id="startOverlay"><div class="card"><div class="hero"><span class="tapWord">TAP TAP</span><br><span class="evoWord">EVO</span></div><img class="heroChar" src="assets/earth/02.png?v=77c26c" alt="地球ちゃん"><div class="sub" id="assetStatus" role="status" aria-live="polite">正式5形態を読み込み中…</div><button class="startBtn" id="start" disabled>START</button></div></section><section class="overlay hidden" id="resultOverlay"><div class="card"><div class="result">RESULT</div><div class="stars">★★★</div><div class="newRecord" id="newRecord"></div><div class="big" id="resultScore">0</div><img class="resultChar" id="resultChar" alt="地球ちゃん"><div class="meta"><div>MAX COMBO<b id="resultCombo">0</b></div><div>TAP<b id="resultTaps">0</b></div></div><button class="startBtn" id="retry">もう一回</button></div></section></main>
<script>
(()=>{'use strict';
const LABELS=['ねむねむ','めざめ','ワイルド','オーバードライブ','MAX!'],TH=[0,11,24,39,57],DURATION=15000,BEST='tte_best_v5';
const $=id=>document.getElementById(id),e={game:$('game'),score:$('score'),bar:$('bar'),sec:$('sec'),stageName:$('stageName'),combo:$('combo'),wrap:$('earthWrap'),canvas:$('earthCanvas'),cur:$('earthCurrent'),next:$('earthNext'),burst:$('burst'),evoText:$('evoText'),growthWord:$('growthWord'),progressHint:$('progressHint'),tap:$('tap'),start:$('start'),retry:$('retry'),startOverlay:$('startOverlay'),resultOverlay:$('resultOverlay'),resultScore:$('resultScore'),resultCombo:$('resultCombo'),resultTaps:$('resultTaps'),newRecord:$('newRecord'),resultChar:$('resultChar'),assetStatus:$('assetStatus')};
function readBest(){try{return Number(localStorage.getItem(BEST)||0)}catch{return 0}}
function writeBest(value){try{localStorage.setItem(BEST,String(value))}catch{}}
let running=false,assetsReady=false,taps=0,score=0,stage=1,combo=0,maxCombo=0,last=0,started=0,raf=0,audioCtx=null,best=readBest();
let earthCtx=null;try{earthCtx=e.canvas.getContext('2d')}catch{}const imageCache=new Map(),rigCache=new Map();let currentFrame='',pendingFrame='',motionMode=0,motionStart=0,motionDuration=520,motionSwapped=false,earthRaf=0,rigImpulse=0,lastRigTap=0;
const GROWTH_WORDS=['むくっ','ぽんっ','ぐるん','びよーん','ぐぐぐっ','どーん！'];
const ASSET_VERSION='2b7ff1',asset=n=>`assets/earth/${String(n).padStart(2,'0')}.png?v=${ASSET_VERSION}`;
const transitionAsset=(s,i)=>`assets/earth/transitions/0${s}_0${s+1}_0${i}.png?v=${ASSET_VERSION}`;
const transitionList=()=>Array.from({length:4},(_,s)=>Array.from({length:3},(_,i)=>transitionAsset(s+1,i))).flat();
function wakeAudio(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;if(!audioCtx)audioCtx=new C();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}catch{return null}}
function tone(freq,duration=.03,volume=.025,type='sine'){const c=wakeAudio();if(!c)return;try{const now=c.currentTime,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(freq,now);g.gain.setValueAtTime(volume,now);g.gain.exponentialRampToValueAtTime(.0001,now+duration);o.connect(g);g.connect(c.destination);o.start(now);o.stop(now+duration)}catch{}}
function playTap(power,evolved){const base=250+power*180;tone(evolved?860:base,evolved?.11:.038,evolved?.06:.034,evolved?'triangle':'square');if(evolved){setTimeout(()=>tone(1080,.08,.048,'triangle'),65);setTimeout(()=>tone(1320,.07,.036,'triangle'),130)}}
function playFinish(){tone(392,.07,.035,'triangle');setTimeout(()=>tone(523,.09,.035,'triangle'),75);setTimeout(()=>tone(659,.12,.04,'triangle'),155)}
function loadAsset(n){const src=asset(n);return new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>{if(img.naturalWidth<512||img.naturalHeight<512){reject(new Error(`asset ${n} too small`));return}imageCache.set(src,img);const decoded=img.decode?.();decoded?decoded.then(()=>resolve(img)).catch(()=>resolve(img)):resolve(img)};img.onerror=()=>reject(new Error(`asset ${n} failed`));img.src=src})}
function preloadAssets(){return Promise.all([... [1,2,3,4,5].map(asset),...transitionList()].map(src=>new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>{if(img.naturalWidth<512||img.naturalHeight<512){reject(new Error(`asset too small: ${src}`));return}imageCache.set(src,img);const decoded=img.decode?.();decoded?decoded.then(()=>resolve(img)).catch(()=>resolve(img)):resolve(img)};img.onerror=()=>reject(new Error(`asset failed: ${src}`));img.src=src}))).then(()=>{assetsReady=true;e.start.disabled=false;e.assetStatus.textContent='15秒で、地球ちゃんをMAXまで育てよう。';showStage(1,false);updateMorph();startEarthRenderer()}).catch(()=>{assetsReady=false;e.start.disabled=true;e.assetStatus.textContent='地球ちゃんを読み込めません。通信を確認して再読み込みしてください。'})}
function stageFor(n){let s=1;for(let i=1;i<TH.length;i++)if(n>=TH[i])s=i+1;return s}
function progressInStage(n,s){if(s>=5)return 1;const a=TH[s-1],b=TH[s];return Math.max(0,Math.min(1,(n-a)/(b-a)))}
function restartClass(el,cls,ms){el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls);setTimeout(()=>el.classList.remove(cls),ms)}
function setFrameImmediate(src){currentFrame=src;pendingFrame='';motionSwapped=true;rigImpulse=.18}
function queueFrame(src,mode){if(pendingFrame)currentFrame=pendingFrame;if(!currentFrame){setFrameImmediate(src);return}pendingFrame=src;motionMode=mode;motionStart=performance.now();motionDuration=mode==='evolve'?760:mode>=5?620:480+mode*22;motionSwapped=false}
function showStage(n,anim=true){stage=n;e.stageName.dataset.stage=n;e.stageName.innerHTML=`STAGE ${n}<b>${LABELS[n-1]}</b>`;e.cur.src=asset(n);e.next.removeAttribute('src');e.next.style.display='none';if(anim){queueFrame(asset(n),'evolve');restartClass(e.wrap,'evolving',820);burst(true);showEvoText()}else setFrameImmediate(asset(n))}
function updateFormFrame(mode){if(stage>=5){queueFrame(asset(5),mode);return}const p=progressInStage(taps,stage),frame=Math.min(2,Math.floor(p*3));queueFrame(p<=0?asset(stage):transitionAsset(stage,frame),mode)}
function updateMorph(){const p=progressInStage(taps,stage),eased=Math.pow(p,.68),visible=stage<5?eased:0,radius=5+visible*68;e.wrap.style.setProperty('--morph',String(visible));e.wrap.style.setProperty('--revealRadius',`${radius.toFixed(1)}%`);e.wrap.style.setProperty('--revealSoft',`${Math.min(91,radius+18).toFixed(1)}%`);e.wrap.style.setProperty('--growthScale',String(1+stage*.022+visible*.075));e.wrap.style.setProperty('--growthLift',`${Math.round(-stage*3-visible*14)}px`);e.wrap.style.setProperty('--charge',String(stage<5?Math.min(1,.18+eased*.82):Math.min(1,.62+combo/24)));e.progressHint.textContent=stage<5?`EVOLVING ${Math.round(p*100)}%`:'MAX POWER'}
const RIG_PARTS=[
 {id:'sprout',cx:.50,cy:.17,rx:.20,ry:.17,z:7},{id:'crown',cx:.50,cy:.35,rx:.46,ry:.30,z:6},
 {id:'body',cx:.50,cy:.59,rx:.30,ry:.29,z:3},{id:'eyeL',cx:.43,cy:.56,rx:.075,ry:.09,z:8},{id:'eyeR',cx:.57,cy:.56,rx:.075,ry:.09,z:8},
 {id:'armL',cx:.27,cy:.68,rx:.17,ry:.17,z:5},{id:'armR',cx:.73,cy:.68,rx:.17,ry:.17,z:5},
 {id:'footL',cx:.42,cy:.82,rx:.16,ry:.13,z:4},{id:'footR',cx:.58,cy:.82,rx:.16,ry:.13,z:4}
];
const RIG_CUTS={crown:['sprout'],body:['eyeL','eyeR','armL','armR','footL','footR']};
function rigCanvas(img,part){const key=`${currentFrame}|${part.id}`,hit=rigCache.get(key);if(hit)return hit;const c=document.createElement('canvas');c.width=c.height=1024;const x=c.getContext('2d');x.save();x.beginPath();x.ellipse(part.cx*1024,part.cy*1024,part.rx*1024,part.ry*1024,0,0,Math.PI*2);x.clip();x.drawImage(img,0,0,1024,1024);x.restore();for(const cutId of RIG_CUTS[part.id]||[]){const cut=RIG_PARTS.find(p=>p.id===cutId);x.save();x.globalCompositeOperation='destination-out';x.beginPath();x.ellipse(cut.cx*1024,cut.cy*1024,cut.rx*1024*.86,cut.ry*1024*.86,0,0,Math.PI*2);x.fill();x.restore()}rigCache.set(key,c);return c}
function rigPose(id,q,beat,active,now){const breathe=Math.sin(now*.004)*.018,pose={x:0,y:0,r:0,sx:1,sy:1};if(id==='body'){pose.sy+=breathe;pose.sx-=breathe*.55}if(id==='sprout'||id==='crown'){pose.r=Math.sin(now*.003+(id==='sprout'?1:0))*.025;pose.y=-Math.abs(Math.sin(now*.003))*3}if(id.startsWith('eye'))pose.sy=.88+.12*Math.abs(Math.sin(now*.0017));if(!active)return pose;const side=id.endsWith('L')?-1:id.endsWith('R')?1:0,power=1+Number(motionMode||0)*.16;if(motionMode==='evolve'){
 const charge=q<.42?q/.42:1-(q-.42)/.58,release=q<.42?0:Math.sin(Math.PI*(q-.42)/.58);pose.x=side*34*charge;pose.y=(id==='sprout'||id==='crown'?-34:id.startsWith('foot')?20:10)*charge-34*release;pose.r=side*.32*charge-side*.18*release;pose.sx=1-.30*charge+.22*release;pose.sy=1-.38*charge+.46*release;return pose}
 if(id==='body'){pose.sx+=beat*(motionMode===0?.25:motionMode===3?-.13:.08);pose.sy+=beat*(motionMode===0?-.22:motionMode===3?.34:.12);pose.y+=beat*(motionMode===0?18:-18)}
 if(id==='sprout'||id==='crown'){pose.r+=(side||1)*Math.sin(Math.PI*2*q)*(.18+.035*power);pose.y-=beat*(22+8*power);pose.sy+=beat*.16*power}
 if(id==='armL'||id==='armR'){const chosen=(motionMode%2===0?id==='armR':id==='armL');pose.x+=side*beat*(chosen?46:16)*power;pose.y-=beat*(chosen?30:8)*power;pose.r+=side*beat*(chosen?.52:.17)*power;pose.sx+=beat*(chosen?.18:.05)}
 if(id==='footL'||id==='footR'){pose.x+=side*beat*12*power;pose.y+=beat*(motionMode>=5?28:12);pose.r-=side*beat*.18}
 if(id.startsWith('eye')){pose.sy=Math.max(.08,1-beat*(motionMode>=4?.88:.48));pose.y-=beat*5}
 if(motionMode>=5){pose.y-=beat*(id.startsWith('foot')?48:82);pose.r+=side*Math.sin(Math.PI*2*q)*.55;pose.sx+=beat*.18;pose.sy+=beat*.24}
 return pose}
function drawRigPart(img,part,pose,global){const c=rigCanvas(img,part),size=590,px=(part.cx-.5)*size,py=(part.cy-.5)*size;earthCtx.save();earthCtx.translate(px+pose.x,py+pose.y);earthCtx.rotate(pose.r);earthCtx.scale(pose.sx,pose.sy);earthCtx.translate(-px,-py);earthCtx.drawImage(c,-size/2,-size/2,size,size);earthCtx.restore()}
function enableCanvasFallback(){e.wrap.classList.add('canvasFallback');e.cur.style.display='block'}
function drawWarpedEarth(now){if(!earthCtx){enableCanvasFallback();return}earthCtx.clearRect(0,0,660,660);if(!currentFrame)return;let q=motionStart?Math.min(1,(now-motionStart)/motionDuration):1;const swapAt=motionMode==='evolve'?.42:.34;if(pendingFrame&&!motionSwapped&&q>=swapAt){currentFrame=pendingFrame;pendingFrame='';motionSwapped=true;rigImpulse=1;burst(motionMode==='evolve'||motionMode>=5)}const img=imageCache.get(currentFrame);if(!img)return;const active=q<1,beat=active?Math.sin(Math.PI*q):0,idle=Math.sin(now*.003)*.012;let sx=1+idle,sy=1-idle,y=0,rot=0;if(motionMode==='evolve'&&active){if(q<.42){const a=q/.42;sx=1-.34*a;sy=1-.42*a;y=30*a;rot=-.10*a}else{const a=(q-.42)/.58,b=Math.sin(Math.PI*a);sx=.66+.34*a+.16*b;sy=.58+.42*a+.25*b;y=30*(1-a)-48*b;rot=-.10*(1-a)+.16*Math.sin(Math.PI*2*a)}}else if(active&&motionMode>=5){y=-70*beat;rot=.18*Math.sin(Math.PI*2*q);sx+=.12*beat;sy+=.18*beat}rigImpulse*=.91;earthCtx.save();earthCtx.translate(330,342+y);earthCtx.rotate(rot);earthCtx.scale(sx,sy);const size=590;earthCtx.globalAlpha=.18;earthCtx.drawImage(img,-size/2,-size/2,size,size);earthCtx.globalAlpha=1;const parts=[...RIG_PARTS].sort((a,b)=>a.z-b.z);for(const part of parts)drawRigPart(img,part,rigPose(part.id,q,beat,active,now),{sx,sy});earthCtx.restore();earthRaf=requestAnimationFrame(drawWarpedEarth)}
function startEarthRenderer(){cancelAnimationFrame(earthRaf);if(!earthCtx){enableCanvasFallback();return}earthRaf=requestAnimationFrame(drawWarpedEarth)}
function afterimage(mode,p){const count=mode>=4?3:2;for(let i=0;i<count;i++){const img=document.createElement('img'),side=i%2?1:-1;img.className='afterimage';img.src=asset(stage<5&&p>.48?stage+1:stage);img.alt='';img.style.setProperty('--dx',`${side*(22+mode*8+i*7)}px`);img.style.setProperty('--dy',`${-16-mode*7-i*8}px`);img.style.setProperty('--rot',`${side*(7+mode*3)}deg`);img.style.setProperty('--ghostScale',String(1.05+mode*.055+i*.025));e.wrap.insertBefore(img,e.burst);setTimeout(()=>img.remove(),540)}}
function showGrowthWord(mode){e.growthWord.textContent=GROWTH_WORDS[mode];e.growthWord.classList.remove('show');void e.growthWord.offsetWidth;e.growthWord.classList.add('show');setTimeout(()=>e.growthWord.classList.remove('show'),580)}
function growthAction(){const p=progressInStage(taps,stage);let mode=Math.min(5,Math.floor(p*6));if(taps%7===0)mode=5;updateFormFrame(mode);afterimage(mode,p);showGrowthWord(mode)}
function burst(big=false){const count=big?18:6;for(let i=0;i<count;i++){const a=(Math.PI*2*i/count)+(Math.random()*.35),d=(big?92:55)+Math.random()*(big?72:35),node=document.createElement(i%3===0?'i':'b');node.className=i%3===0?'leaf':'spark';node.style.setProperty('--x',`${Math.cos(a)*d}px`);node.style.setProperty('--y',`${Math.sin(a)*d}px`);node.style.setProperty('--r',`${Math.round(a*57.3)}deg`);e.burst.appendChild(node);setTimeout(()=>node.remove(),700)}if(big){const r=document.createElement('span');r.className='ring';e.burst.appendChild(r);setTimeout(()=>r.remove(),520)}}
function showEvoText(){e.evoText.classList.remove('show');void e.evoText.offsetWidth;e.evoText.classList.add('show');setTimeout(()=>e.evoText.classList.remove('show'),780)}
function screenKick(){restartClass(e.game,'kick',150)}
function press(){if(!running)return;const now=performance.now();taps++;combo=now-last<520?combo+1:1;last=now;maxCombo=Math.max(maxCombo,combo);score+=100+(combo>=20?25:combo>=10?15:combo>=5?7:0);e.score.textContent=score.toLocaleString();e.combo.innerHTML=`<strong>${combo}</strong> combo`;const oldStage=stage,s=stageFor(taps),evolved=s!==oldStage;if(evolved){showStage(s,true);screenKick();try{navigator.vibrate?.([18,24,28])}catch{}}else{growthAction();burst(progressInStage(taps,stage)>.72);if(combo>0&&combo%10===0){restartClass(e.wrap,'comboBurst',360);screenKick();burst(true);try{navigator.vibrate?.([8,12,14])}catch{}}else{try{navigator.vibrate?.(6)}catch{}}}updateMorph();playTap(progressInStage(taps,stage),evolved)}
function tick(now){if(!running)return;const left=Math.max(0,DURATION-(now-started));e.bar.style.transform=`scaleX(${left/DURATION})`;e.sec.textContent=Math.ceil(left/1000);if(left<=0){finish();return}raf=requestAnimationFrame(tick)}
function begin(){if(!assetsReady)return;wakeAudio();tone(392,.055,.035,'triangle');cancelAnimationFrame(raf);running=true;taps=0;score=0;stage=1;combo=0;maxCombo=0;last=0;started=performance.now();e.score.textContent='0';e.combo.innerHTML='<strong>0</strong> combo';e.bar.style.transform='scaleX(1)';e.sec.textContent='15';showStage(1,false);updateMorph();e.tap.disabled=false;e.startOverlay.classList.add('hidden');e.resultOverlay.classList.add('hidden');raf=requestAnimationFrame(tick)}
function finish(){if(!running)return;running=false;cancelAnimationFrame(raf);e.tap.disabled=true;e.bar.style.transform='scaleX(0)';e.sec.textContent='0';const isNew=score>best;if(isNew){best=score;writeBest(best)}e.newRecord.textContent=isNew?'NEW RECORD!':'';e.resultScore.textContent=score.toLocaleString();e.resultCombo.textContent=maxCombo;e.resultTaps.textContent=taps;e.resultChar.src=asset(stage);e.resultOverlay.classList.remove('hidden');playFinish()}
e.tap.addEventListener('pointerdown',x=>{x.preventDefault();press()},{passive:false});e.start.addEventListener('click',begin);e.retry.addEventListener('click',begin);preloadAssets();
})();

name: TAP TAP EVO RC6 Preview Publisher

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'tap-tap-preview-rc6'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: tap-tap-preview-rc6
          fetch-depth: 0

      - name: Fetch verified RC6 artifact
        env:
          RC6_URL: "https://sdmntprjapaneast.oaiusercontent.com/files/00000000-af40-8209-b5f5-24ad04ef450f/raw?se=2026-08-24T21%3A02%3A31Z&sp=r&sv=2026-02-06&sr=b&scid=dd53031e-1f80-5296-b11a-240ba748166e&skoid=b1bca990-dcac-4c31-8ca1-ac563cf24c54&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-24T20%3A48%3A12Z&ske=2026-08-25T20%3A48%3A12Z&sks=b&skv=2026-02-06&sig=g1UwriOgxWP4iCdS6sn5pzT2tJJqzSvRWPEmg4ugEI0%3D"
        run: |
          set -euo pipefail
          rm -rf /tmp/rc6_outer tap-tap-evo
          mkdir -p /tmp/rc6_outer tap-tap-evo
          curl --fail --location --retry 3 "$RC6_URL" -o /tmp/rc6_outer.zip
          unzip -q /tmp/rc6_outer.zip -d /tmp/rc6_outer
          test -f /tmp/rc6_outer/tap-tap-evo-itchio-rc6-candidate.zip
          echo "9a7c80e5c52c1e5ff8bd25bc71e5540e6576529e5f01272b8d8ccf7533167e8a  /tmp/rc6_outer/tap-tap-evo-itchio-rc6-candidate.zip" | sha256sum -c -
          unzip -q /tmp/rc6_outer/tap-tap-evo-itchio-rc6-candidate.zip -d tap-tap-evo

      - name: Verify exact 19-file RC6 payload
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path('tap-tap-evo')
          manifest_path = root/'deployment_manifest.json'
          manifest = json.loads(manifest_path.read_text())
          expected = {x['path']: x['sha256'] for x in manifest['files']}
          expected_files = sorted([*expected.keys(), 'deployment_manifest.json'])
          actual = sorted(str(p.relative_to(root)) for p in root.rglob('*') if p.is_file())
          if actual != expected_files:
              raise SystemExit(f'file set mismatch: {actual} != {expected_files}')
          for rel, sha in expected.items():
              got = hashlib.sha256((root/rel).read_bytes()).hexdigest()
              if got != sha:
                  raise SystemExit(f'hash mismatch: {rel}: {got} != {sha}')
          print('RC6 exact 19-file package verified')
          PY

      - name: Commit preview payload
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tap-tap-evo
          if git diff --cached --quiet; then
            echo 'Preview payload already current'
            exit 0
          fi
          git commit -m 'Publish exact TAP TAP EVO RC6 preview payload'
          git push origin HEAD:tap-tap-preview-rc6
